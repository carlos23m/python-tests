name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      # ── Layer 1: Restful-booker (no local infra needed) ──────────────────
      - name: API external tests (Restful-booker)
        run: pytest tests/api_external/ -v --tb=short

      # ── Layer 2: own pipeline ─────────────────────────────────────────────
      - name: Start infra (postgres, kafka, localstack)
        run: docker compose up -d postgres zookeeper kafka localstack

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 20); do
            docker compose exec -T postgres pg_isready -U weather && break
            sleep 3
          done

      - name: Wait for Kafka
        run: |
          for i in $(seq 1 20); do
            docker compose exec -T kafka kafka-broker-api-versions \
              --bootstrap-server localhost:9092 && break
            sleep 3
          done

      - name: Start app and consumer
        run: docker compose up -d app consumer

      - name: Wait for app
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break
            sleep 3
          done

      - name: Unit tests
        run: pytest tests/unit/ -v --tb=short
        env:
          DATABASE_URL: postgresql://weather:weather@localhost:5432/weather

      - name: API tests (own endpoints)
        run: pytest tests/api/ -v --tb=short

      - name: Messaging / integration tests
        run: pytest tests/messaging/ -v --tb=short
        env:
          DATABASE_URL: postgresql://weather:weather@localhost:5432/weather
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092

      - name: AWS / LocalStack tests
        run: pytest tests/aws/ -v --tb=short

      # ── Load smoke (60 s, fails on >5 % error rate) ──────────────────────
      - name: Load smoke test
        run: |
          locust -f tests/performance/locustfile.py \
            --headless -u 10 -r 2 --run-time 60s \
            --host http://localhost:8000 \
            --exit-code-on-error 1
